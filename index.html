<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jubilados Parciales</title>
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
<style>
body { font-family: Arial, sans-serif; margin: 20px; text-align: center; background-color: #f2f4f8; }

/* Cuadros superiores */
#infoPersonal, #añosRestantes, #vacacionesRestantes { 
    position: absolute; 
    background-color: #95cfa8; /* Verde aqua */
    padding: 10px; 
    border-radius: 6px; 
    box-shadow: 1px 1px 6px rgba(0,0,0,0.2); 
    text-align: left; 
}

#infoPersonal { top: 20px; left: 20px; }
#añosRestantes { top: 160px; left: 20px; }
#vacacionesRestantes { top: 20px; right: 20px; }

.mes-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 400px; min-height: 80vh; }
.mini-calendar { width: 48%; height: 60vh; border: 1px solid #aaa; padding: 5px; background-color: #f5f5f5; border-radius: 6px; box-shadow: 1px 1px 6px rgba(0,0,0,0.1); overflow: hidden; display: none; }
.fc .fc-col-header-cell-cushion { font-size: 0.85em; }
.fc .fc-daygrid-day-number { font-size: 0.85em; }
.fc-event { cursor: pointer; background-color: #4CAF50 !important; color: white !important; font-size: 0.75em; }
.fc-day-sat { background-color: #e0e0e0; }
.fc-day-sun { background-color: #ffcfcf; }
.fc-day-festivo { background-color: #ffcccc; color: #ff0000; }
.fc-day-vacaciones { background-color: #fff39e !important; }

/* Colores distintos por año */
.fc-toolbar-year-0 .fc-toolbar-title { background:#007bff; color:white; padding:2px 6px; border-radius:4px; }
.fc-toolbar-year-1 .fc-toolbar-title { background:#28a745; color:white; padding:2px 6px; border-radius:4px; }
.fc-toolbar-year-2 .fc-toolbar-title { background:#ff9800; color:white; padding:2px 6px; border-radius:4px; }

/* Botones */
button { 
    padding: 8px 16px; 
    font-size: 14px; 
    margin: 5px; 
    cursor: pointer; 
    border-radius: 5px; 
    border: none; 
    background-color: #556B2F; /* Verde ceniza */
    color: white; 
}
button:hover { 
    background-color: #6B8E23; /* Verde más claro al pasar el mouse */
}

#pagination { margin: 10px 0; font-weight: bold; }

@media (max-width: 768px){ 
    .mini-calendar { width: 90%; height: 50vh; } 
}
</style>
</head>
<body>

<div id="infoPersonal"></div>
<div id="añosRestantes"></div>
<div id="vacacionesRestantes"></div>

<h1>Calculo Jubilados Parciales</h1>

<div>
<button id="prevPageBtn">Anterior</button>
<button id="nextPageBtn">Siguiente</button>
<button id="clearBtn">Limpiar contador</button>
<button id="toggleModeBtn">Modo: 8 horas</button>
<button id="exportPdfBtn">Exportar a PDF</button>
</div>

<div id="pagination"></div>
<p>Total de horas (domingo o festivo no cuenta): <span id="totalHours">0</span> horas</p>
<div class="mes-container" id="mesContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const numero = prompt("Introduzca el número del trabajador:");
  const nombre = prompt("Introduzca el nombre del trabajador:");
  const fechaNacimiento = prompt("Introduzca la fecha de nacimiento (AAAA-MM-DD):");
  const fechaInicialStr = prompt("Introduzca la fecha inicial del calendario (AAAA-MM-DD):");
  const fechaInicial = new Date(fechaInicialStr);
  let mode = '8h';

  function calcularEdadCompleta(nacimiento, hoy){
    let años = hoy.getFullYear() - nacimiento.getFullYear();
    let meses = hoy.getMonth() - nacimiento.getMonth();
    let dias = hoy.getDate() - nacimiento.getDate();
    if(dias<0){ meses--; dias += new Date(hoy.getFullYear(), hoy.getMonth(), 0).getDate(); }
    if(meses<0){ años--; meses += 12; }
    return {años, meses, dias};
  }

  let edadStr="N/A", fecha65Str="N/A", diasHasta65=0, horasTotalesRestantes=0;
  if(fechaNacimiento && !isNaN(new Date(fechaNacimiento))){
    const nacimiento = new Date(fechaNacimiento);
    const hoy = new Date();
    const edad = calcularEdadCompleta(nacimiento, hoy);
    edadStr = `${edad.años} años, ${edad.meses} meses, ${edad.dias} días`;
    const fecha65 = new Date(nacimiento); fecha65.setFullYear(fecha65.getFullYear()+65);
    fecha65Str = fecha65.toISOString().split('T')[0];
    diasHasta65 = Math.ceil((fecha65 - hoy)/(1000*60*60*24));
    horasTotalesRestantes = Math.floor((diasHasta65*8)/2);
  }

  const fechaAno1Fin = new Date(fechaInicial); fechaAno1Fin.setFullYear(fechaAno1Fin.getFullYear()+1);
  const fechaAno2Fin = new Date(fechaAno1Fin); fechaAno2Fin.setFullYear(fechaAno2Fin.getFullYear()+1);

  let horasAno1=0, horasAno2=0, horasAno3=0, horasRestantes=horasTotalesRestantes;
  if(horasTotalesRestantes <= 450){ horasAno1 = horasTotalesRestantes; }
  else if(horasTotalesRestantes <= 900){ horasAno1 = horasTotalesRestantes-450; horasAno2=450; }
  else { horasAno1 = horasTotalesRestantes-900; horasAno2=450; horasAno3=450; }

  let vacAno1=0, vacAno2=0, vacAno3=0;
  function actualizarVacaciones(){
    document.getElementById('vacacionesRestantes').innerHTML = `
      <strong>Días de vacaciones:</strong><br>
      1º año: ${vacAno1} días<br>
      2º año: ${vacAno2} días<br>
      3º año: ${vacAno3} días<br>
      <em>Total: ${vacAno1+vacAno2+vacAno3} días</em>
    `;
  }

  document.getElementById('infoPersonal').innerHTML = `<strong>Trabajador:</strong> ${numero} - ${nombre}<br>
    <strong>Edad actual:</strong> ${edadStr}<br>
    <strong>Cumple 65 años:</strong> ${fecha65Str}<br>
    <strong>Días hasta 65 años:</strong> ${diasHasta65} días<br>
    <strong>Inicio calendario:</strong> ${fechaInicialStr}`;

  const añosRestantesDiv = document.getElementById('añosRestantes');
  function actualizarAñosRestantes(){ 
    añosRestantesDiv.innerHTML = `
      <strong>Total horas restantes:</strong> ${horasRestantes} horas<br>
      <strong>Distribución:</strong><br>
      1º año: ${horasAno1} horas<br>
      2º año: ${horasAno2} horas<br>
      3º año: ${horasAno3} horas
    `;
  }
  actualizarAñosRestantes();
  actualizarVacaciones();

  const festivosBase = ["01-01","01-06","05-01","08-15","10-12","11-01","12-06","12-08","12-25"];
  const festivos=[];
  for(let y=0;y<3;y++){ const year = fechaInicial.getFullYear()+y; festivosBase.forEach(d=>festivos.push(`${year}-${d}`)); }
  function esFestivo(fecha){ return festivos.includes(fecha); }

  const mesContainer = document.getElementById('mesContainer');
  let events=[], miniCalendars=[], currentPage=0, pageSize=6;

  function formatLocalDate(date){ 
    return date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0')+'-'+String(date.getDate()).padStart(2,'0'); 
  }

  let fecha = new Date(fechaInicial);
  for(let i=0;i<36;i++){
    const mesDiv = document.createElement('div');
    mesDiv.classList.add('mini-calendar');
    mesContainer.appendChild(mesDiv);
    miniCalendars.push({el: mesDiv, date: new Date(fecha), calendar: null});
    fecha.setMonth(fecha.getMonth()+1);
  }

  function yearIndexForDate(date){
    if(date < fechaAno1Fin) return 0;
    if(date < fechaAno2Fin) return 1;
    return 2;
  }

  function initCalendar(calObj){
    if(calObj.calendar) return;
    const idx = yearIndexForDate(calObj.date);
    const calendar = new FullCalendar.Calendar(calObj.el,{
      initialView:'dayGridMonth',
      initialDate: formatLocalDate(calObj.date),
      selectable:true,
      editable:true,
      locale:'es',
      fixedWeekCount:false,
      showNonCurrentDates:false,
      headerToolbar:{left:'',center:'title',right:''},
      select:function(info){
        let current = new Date(info.start);
        const end = new Date(info.end.getTime()-86400000);
        while(current<=end){
          const dateStr = formatLocalDate(current);
          const dow = current.getDay();
          if(dow!==0 && !esFestivo(dateStr)){
            const existing = events.find(e=>e.start===dateStr);
            const idxSel = yearIndexForDate(current);
            if(existing){
              if(existing.extendedProps.vacaciones){
                if(idxSel===0) vacAno1--; 
                if(idxSel===1) vacAno2--; 
                if(idxSel===2) vacAno3--; 
              } else {
                if(idxSel===0) horasAno1 += existing.extendedProps.hours;
                if(idxSel===1) horasAno2 += existing.extendedProps.hours;
                if(idxSel===2) horasAno3 += existing.extendedProps.hours;
                horasRestantes += existing.extendedProps.hours;
              }
              events = events.filter(e=>e.start!==dateStr);
            } else {
              const hours = mode==='8h'?8:0;
              const vacaciones = mode!=='8h';
              events.push({title: vacaciones?'Vacaciones':'8h', start: dateStr, allDay:true,
                extendedProps:{hours:hours, dayOfWeek:dow, vacaciones:vacaciones}});
              if(vacaciones){
                if(idxSel===0) vacAno1++;
                if(idxSel===1) vacAno2++;
                if(idxSel===2) vacAno3++;
              } else {
                if(idxSel===0 && horasAno1>=8){ horasAno1-=8; horasRestantes-=8; }
                if(idxSel===1 && horasAno2>=8){ horasAno2-=8; horasRestantes-=8; }
                if(idxSel===2 && horasAno3>=8){ horasAno3-=8; horasRestantes-=8; }
              }
            }
          }
          current.setDate(current.getDate()+1);
        }
        actualizarAñosRestantes();
        actualizarVacaciones();
        miniCalendars.forEach(c=>c.calendar?.refetchEvents());
      },
      events:(info,cb)=>cb(events),
      dayCellClassNames:(arg)=>{
        const f=formatLocalDate(arg.date);
        const e=events.find(ev=>ev.start===f);
        if(e && e.extendedProps.vacaciones) return ['fc-day-vacaciones'];
        if(esFestivo(f)) return ['fc-day-festivo'];
        if(arg.date.getDay()===0) return ['fc-day-sun'];
        if(arg.date.getDay()===6) return ['fc-day-sat'];
        return [];
      }
    });
    calendar.render();
    calendar.el.classList.add(`fc-toolbar-year-${idx}`);
    calObj.calendar=calendar;
  }

  function showPage(page){
    miniCalendars.forEach(c=>c.el.style.display='none');
    const start=page*pageSize;
    const end=Math.min(start+pageSize, miniCalendars.length);
    for(let i=start;i<end;i++){
      const calObj=miniCalendars[i];
      calObj.el.style.display='flex';
      initCalendar(calObj);
      calObj.calendar.refetchEvents();
    }
    document.getElementById('pagination').textContent=`Página ${page+1} de ${Math.ceil(miniCalendars.length/pageSize)}`;
  }

  document.getElementById('toggleModeBtn').addEventListener('click',function(){
    mode=mode==='8h'?'vacaciones':'8h';
    this.textContent=`Modo: ${mode==='8h'?'8 horas':'Vacaciones'}`;
  });

  document.getElementById('clearBtn').addEventListener('click',function(){
    if(confirm("¿Desea limpiar todos los días seleccionados?")){
      events=[];
      horasRestantes=horasTotalesRestantes;
      if(horasTotalesRestantes <= 450){ horasAno1=horasTotalesRestantes; horasAno2=0; horasAno3=0; }
      else if(horasTotalesRestantes <= 900){ horasAno1=horasTotalesRestantes-450; horasAno2=450; horasAno3=0; }
      else { horasAno1=horasTotalesRestantes-900; horasAno2=450; horasAno3=450; }
      vacAno1=0; vacAno2=0; vacAno3=0;
      actualizarAñosRestantes();
      actualizarVacaciones();
      miniCalendars.forEach(c=>c.calendar?.refetchEvents());
    }
  });

  document.getElementById('prevPageBtn').addEventListener('click',()=>{ if(currentPage>0){ currentPage--; showPage(currentPage);} });
  document.getElementById('nextPageBtn').addEventListener('click',()=>{ if((currentPage+1)*pageSize<miniCalendars.length){ currentPage++; showPage(currentPage);} });
  
  showPage(currentPage);
});
</script>
</body>
</html>
