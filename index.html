<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jubilados Parciales</title>
<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css" rel="stylesheet">
<style>
body { font-family: Arial, sans-serif; margin: 20px; text-align: center; background-color: #f2f4f8; }
#infoPersonal, #añosRestantes, #vacacionesRestantes {
    position: fixed; background-color: #95cfa8; padding: 10px; border-radius: 6px;
    box-shadow: 1px 1px 6px rgba(0,0,0,0.2); text-align: left; z-index: 10; width: 240px;
}
#infoPersonal { top: 20px; left: 20px; }
#añosRestantes { top: 180px; left: 20px; }
#vacacionesRestantes { top: 20px; right: 20px; }
h1 { margin-top: 260px; }
div > button { padding: 8px 16px; font-size: 14px; margin: 5px; cursor: pointer; border-radius: 5px; border: none; background-color: #556B2F; color: white; }
div > button:hover { background-color: #6B8E23; }
.mes-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 20px; min-height: 80vh; }
.mini-calendar { width: 48%; height: 60vh; border: 1px solid #aaa; padding: 5px; background-color: #f5f5f5; border-radius: 6px; box-shadow: 1px 1px 6px rgba(0,0,0,0.1); overflow: hidden; display: none; }
.fc .fc-col-header-cell-cushion { font-size: 0.85em; }
.fc .fc-daygrid-day-number { font-size: 0.85em; }
.fc-event { cursor: pointer; font-size: 0.75em; }
.fc-day-sat { background-color: #e0e0e0; }
.fc-day-sun { background-color: #ffcfcf; }
.fc-day-festivo { background-color: #ffcccc; color: #ff0000; }
.fc-day-vacaciones { background-color: #fff39e !important; }
@media (max-width: 768px){ 
    .mini-calendar { width: 90%; height: 50vh; } 
    #infoPersonal, #añosRestantes, #vacacionesRestantes { width: 90%; left: 5%; }
    #vacacionesRestantes { right: 5%; }
}
</style>
</head>
<body>

<div id="infoPersonal"></div>
<div id="añosRestantes"></div>
<div id="vacacionesRestantes"></div>

<h1>Calculo Jubilados Parciales</h1>

<div>
<button id="prevPageBtn">Anterior</button>
<button id="nextPageBtn">Siguiente</button>
<button id="clearBtn">Limpiar contador</button>
<button id="toggleModeBtn">Modo: 8 horas</button>
<button id="exportPdfBtn">Exportar a PDF (Relatório)</button>
</div>

<div id="pagination"></div>
<div class="mes-container" id="mesContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const numero = prompt("Introduzca el número del trabajador:");
  const nombre = prompt("Introduzca el nombre del trabajador:");
  const fechaNacimientoStr = prompt("Introduzca la fecha de nacimiento (AAAA-MM-DD):");
  const fechaInicialStr = prompt("Introduzca la fecha inicial del calendario (AAAA-MM-DD):");

  const fechaNacimiento = new Date(fechaNacimientoStr);
  const fechaInicial = new Date(fechaInicialStr);
  const fecha65 = new Date(fechaNacimiento); fecha65.setFullYear(fechaNacimiento.getFullYear()+65);

  let mode = '8h';
  const hoy = new Date();
  function calcularEdadCompleta(nacimiento, hoy){
    let años = hoy.getFullYear() - nacimiento.getFullYear();
    let meses = hoy.getMonth() - nacimiento.getMonth();
    let dias = hoy.getDate() - nacimiento.getDate();
    if(dias<0){ meses--; dias += new Date(hoy.getFullYear(), hoy.getMonth(), 0).getDate(); }
    if(meses<0){ años--; meses+=12; }
    return {años, meses, dias};
  }
  const edad = calcularEdadCompleta(fechaNacimiento, hoy);
  const diasHasta65 = Math.ceil((fecha65 - hoy)/(1000*60*60*24));

  // Cálculo correto das horas
  const diasPrimerAno = Math.min(365, diasHasta65);
  const horasPrimerAno = (diasPrimerAno/7)*28.5;
  const diasRestantes = diasHasta65 - diasPrimerAno;
  const horasRestantesSeguintes = (diasRestantes/7)*10;
  let horasTotalesRestantes = Math.round(horasPrimerAno + horasRestantesSeguintes);
  let horasRestantes = horasTotalesRestantes;
  let vacAno1 = 0;

  function actualizarCuadros(){
    document.getElementById('infoPersonal').innerHTML = `
      <strong>Trabajador:</strong> ${numero} - ${nombre}<br>
      <strong>Edad actual:</strong> ${edad.años} años, ${edad.meses} meses, ${edad.dias} días<br>
      <strong>Cumple 65 años:</strong> ${fecha65.toISOString().split('T')[0]}<br>
      <strong>Días hasta 65 años:</strong> ${diasHasta65} días
    `;
    document.getElementById('añosRestantes').innerHTML = `<strong>Horas restantes:</strong> ${horasRestantes} horas`;
    document.getElementById('vacacionesRestantes').innerHTML = `<strong>Días de vacaciones:</strong> ${vacAno1} días`;
  }
  actualizarCuadros();

  const mesContainer = document.getElementById('mesContainer');
  const festivosBase = ["01-01","01-06","05-01","08-15","10-12","11-01","12-06","12-08","12-25"];
  const festivos = [];
  for(let y=fechaInicial.getFullYear(); y <= fecha65.getFullYear(); y++){ festivosBase.forEach(d=>festivos.push(`${y}-${d}`)); }
  function esFestivo(f){ return festivos.includes(f); }

  const miniCalendars = [];
  const pageSize = 6;
  let currentPage = 0;
  let eventos = [];

  function formatLocalDate(date){ return date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0')+'-'+String(date.getDate()).padStart(2,'0'); }

  let fecha = new Date(fechaInicial);
  while(fecha <= fecha65){
    const mesDiv = document.createElement('div');
    mesDiv.classList.add('mini-calendar');
    mesContainer.appendChild(mesDiv);
    miniCalendars.push({el: mesDiv, date: new Date(fecha), calendar: null});
    fecha.setMonth(fecha.getMonth()+1);
  }

  function initCalendar(calObj){
    if(calObj.calendar) return;
    const calendar = new FullCalendar.Calendar(calObj.el,{
      initialView:'dayGridMonth',
      initialDate: formatLocalDate(calObj.date),
      selectable:true,
      editable:true,
      locale:'es',
      fixedWeekCount:false,
      showNonCurrentDates:false,
      headerToolbar:{left:'',center:'title',right:''},
      select:function(info){
        let current = new Date(info.start);
        let end = new Date(info.end.getTime()-86400000);
        if(end < current) end = new Date(info.start);
        let diasSeleccionados = [];
        while(current <= end){
          const dateStr = formatLocalDate(current);
          if(current.getDay()!==0 && !esFestivo(dateStr)) diasSeleccionados.push(dateStr);
          current.setDate(current.getDate()+1);
        }

        const esSemanaCompleta = diasSeleccionados.length===6 && new Date(diasSeleccionados[0]).getDay()===1;
        if(esSemanaCompleta){
          const existeSemana = diasSeleccionados.every(d => eventos.find(e=>e.fecha===d && !e.vacaciones));
          if(existeSemana){
            diasSeleccionados.forEach(d => { eventos = eventos.filter(e=>e.fecha!==d); });
            horasRestantes += 40;
          } else {
            diasSeleccionados.forEach(d => eventos.push({fecha:d,vacaciones:false,semana:true,title:'40h'}));
            horasRestantes = Math.max(0, horasRestantes-40);
          }
        } else {
          diasSeleccionados.forEach(d => {
            const existente = eventos.find(e=>e.fecha===d);
            if(existente){
              if(!existente.vacaciones) horasRestantes+=8; else vacAno1--;
              eventos = eventos.filter(e=>e.fecha!==d);
            } else {
              if(mode==='8h'){ horasRestantes = Math.max(0, horasRestantes-8); eventos.push({fecha:d,vacaciones:false,title:'8h'}); }
              else { vacAno1++; eventos.push({fecha:d,vacaciones:true,title:'Vacaciones'}); }
            }
          });
        }

        actualizarCuadros();
        miniCalendars.forEach(c=>{
          if(c.calendar){
            c.calendar.removeAllEvents();
            eventos.forEach(ev=>c.calendar.addEvent({start:ev.fecha, title:ev.title, allDay:true}));
          }
        });
      },
      events:(info,cb)=>cb(eventos.map(e=>({start:e.fecha,title:e.title,allDay:true}))),
      dayCellClassNames:(arg)=>{
        const f=formatLocalDate(arg.date);
        const e=eventos.find(ev=>ev.fecha===f);
        if(e && e.vacaciones) return ['fc-day-vacaciones'];
        if(esFestivo(f)) return ['fc-day-festivo'];
        if(arg.date.getDay()===0) return ['fc-day-sun'];
        if(arg.date.getDay()===6) return ['fc-day-sat'];
        return [];
      }
    });
    calendar.render();
    calObj.calendar=calendar;
  }

  function showPage(page){
    miniCalendars.forEach(c=>c.el.style.display='none');
    const start = page*pageSize;
    const end = Math.min(start+pageSize, miniCalendars.length);
    for(let i=start;i<end;i++){
      const calObj=miniCalendars[i];
      calObj.el.style.display='flex';
      initCalendar(calObj);
      calObj.calendar.refetchEvents();
    }
    document.getElementById('pagination').textContent=`Página ${page+1} de ${Math.ceil(miniCalendars.length/pageSize)}`;
  }

  document.getElementById('toggleModeBtn').addEventListener('click', ()=>{
    mode = mode==='8h'?'vacaciones':'8h';
    document.getElementById('toggleModeBtn').textContent=`Modo: ${mode==='8h'?'8 horas':'Vacaciones'}`;
  });

  document.getElementById('clearBtn').addEventListener('click', ()=>{
    if(confirm("¿Desea limpiar todos los días seleccionados?")){
      eventos=[]; horasRestantes=horasTotalesRestantes; vacAno1=0;
      actualizarCuadros();
      miniCalendars.forEach(c=>c.calendar?.removeAllEvents());
    }
  });

  document.getElementById('prevPageBtn').addEventListener('click',()=>{ if(currentPage>0){ currentPage--; showPage(currentPage);} });
  document.getElementById('nextPageBtn').addEventListener('click',()=>{ if((currentPage+1)*pageSize<miniCalendars.length){ currentPage++; showPage(currentPage);} });

  document.getElementById('exportPdfBtn').addEventListener('click', ()=>{
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p','pt','a4');
    pdf.setFontSize(12);
    let y = 40;
    pdf.text(`Trabajador: ${numero} - ${nombre}`, 40, y); y+=20;
    pdf.text(`Edad actual: ${edad.años} años, ${edad.meses} meses, ${edad.dias} días`, 40, y); y+=20;
    pdf.text(`Cumple 65 años: ${fecha65.toISOString().split('T')[0]}`, 40, y); y+=20;
    pdf.text(`Días hasta 65 años: ${diasHasta65}`, 40, y); y+=20;
    pdf.text(`Horas restantes: ${horasRestantes}`, 40, y); y+=20;
    pdf.text(`Días de vacaciones: ${vacAno1}`, 40, y); y+=30;
    pdf.text('Detalle de días seleccionados:', 40, y); y+=20;
    if(eventos.length===0){ pdf.text('No hay días seleccionados.',40,y); }
    else{
      eventos.forEach(e=>{
        pdf.text(`${e.fecha} - ${e.vacaciones?'Vacaciones':e.title}`,40,y); y+=15;
        if(y>750){ pdf.addPage(); y=40; }
      });
    }
    pdf.save(`Jubilado_${nombre}_relatorio.pdf`);
  });

  showPage(currentPage);
});
</script>
</body>
</html>
